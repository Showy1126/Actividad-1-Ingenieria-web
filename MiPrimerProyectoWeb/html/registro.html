<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="../Css/estilosRegistro.css">
</head>
<body>
    <!-- header -->
    <header>
        <div class="img-container">
            <img src="../Img/logo.png" alt="logo" class="logo">
            <span class="nombre-logo">Secure</span>
        </div>
        <nav>
            <ul>
                <li><a href="#">Iniciar Sesion</a></li>
                <li><a href="#" class="segundo-enlace">Registrarse</a></li>
                
            </ul>
        </nav>
    </header>

    <!-- main -->
    <main>
      <div class="form-container">
        <form class="form">
            <h1>Registro</h1>
            <span>Ingrese su nombre</span><br>
            <input type="text" placeholder="Nombre" required><br>
            <span>Ingrese su correo</span><br>
            <input type="email" placeholder="Correo" required><br>
            <span>Crea tu contraseña</span><br>
            <input type="password" placeholder="Contraseña" required><br>
            <input type="submit" value="Registrarse" class="boton-envio">
        </form>
      </div>
    </main>
    
</body>
</html>
